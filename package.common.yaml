- &common
  language: GHC2024
  default-extensions:
    - EmptyCase
    - FlexibleContexts
    - FlexibleInstances
    - InstanceSigs
    - MultiParamTypeClasses
    - FunctionalDependencies
    - LambdaCase
    - MultiWayIf
    - NamedFieldPuns
    - RecordWildCards
    - TupleSections
    - DeriveFoldable
    - DeriveFunctor
    - DeriveGeneric
    - DeriveLift
    - DeriveTraversable
    - DerivingStrategies
    - GeneralizedNewtypeDeriving
    - StandaloneDeriving
    - BangPatterns
    - StrictData
    - KindSignatures
    - TypeOperators
    - OverloadedStrings
    - ScopedTypeVariables
    - TypeApplications
    - ConstraintKinds
    - ApplicativeDo
    - DefaultSignatures
    - PatternSynonyms
    - TemplateHaskell
    - DisambiguateRecordFields
    - DuplicateRecordFields
    - OverloadedLabels
    - UndecidableInstances
    - NoFieldSelectors
    - AllowAmbiguousTypes
  ghc-options:
    - -Wall
    - -Wcompat
    - -Wmissing-export-lists
    - -Widentities
    - -Wredundant-constraints
    - -Werror=missing-home-modules
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

- &test-ghc-options
  - -Wno-incomplete-uni-patterns

- &flags
  flags:
    in-nix-shell:
      description: Build tools are provided by the Nix development shell.
      default: false
      manual: true
